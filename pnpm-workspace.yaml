packages:
  - "apps/*"
  - "packages/*"
  - "packages/tooling/*"
  - "packages/flixlix-cards/*"
  - "packages/utils/*"

allowBuilds:
  esbuild: false
  msw: false
  unrs-resolver: false

catalog:
  "@testing-library/dom": ^10.4.1
  "@types/node": ^22.19.17
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  jsdom: ^28.1.0
  lucide-react: ^0.545.0
  react: ^19.2.5
  react-dom: ^19.2.5
  tailwindcss: ^4.2.4
  typescript: ^6.0.3
  vite-tsconfig-paths: ^6.1.1

catalogs:
  packages:
    "@babel/core": ^7.29.0
    "@babel/preset-env": ^7.29.3
    "@changesets/changelog-github": ^0.6.0
    "@changesets/cli": ^2.31.0
    "@mdi/js": ^7.4.47
    "@rollup/plugin-babel": ^7.0.0
    "@rollup/plugin-commonjs": ^29.0.2
    "@rollup/plugin-json": ^6.1.0
    "@rollup/plugin-node-resolve": ^16.0.3
    "@rollup/plugin-terser": ^1.0.0
    "@rollup/plugin-typescript": ^12.3.1
    "@types/sortablejs": ^1.15.9
    clsx: ^2.1.1
    conventional-changelog-conventionalcommits: ^4.6.3
    custom-card-helpers: ^2.0.0
    home-assistant-js-websocket: ^9.8.1
    lit: ^3.3.3
    memoize-one: ^6.0.0
    rollup: ^4.68.0
    rollup-plugin-minify-html-literals: ^1.2.6
    rollup-plugin-serve: ^1.1.1
    superstruct: ^2.0.2
    sortablejs: ^1.15.7
    tailwind-merge: ^3.5.0
    vitest: 5.1.0
    vite: npm:@voidzero-dev/vite-plus-core@1.5.0
    vite-plus: 1.5.0
overrides:
  vite@*: catalog:packages
  vitest@*: catalog:packages
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
