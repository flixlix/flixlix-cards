        availability: "{{ is_state('input_boolean.devices_available', 'on') }}"
      - name: Battery SoC
        unique_id: e2e_battery_soc
        icon: mdi:battery-50
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: "{{ states('input_number.battery_soc') }}"
        availability: "{{ is_state('input_boolean.battery_available', 'on') }}"
      - name: Fossil Percentage
        unique_id: e2e_fossil_percentage
        icon: mdi:factory
        unit_of_measurement: "%"
        state_class: measurement
        state: "{{ states('input_number.fossil_percentage') }}"
        availability: "{{ is_state('input_boolean.grid_available', 'on') }}"
