        unique_id: e2e_non_fossil_percentage
        icon: mdi:leaf
        unit_of_measurement: "%"
        state_class: measurement
        state: "{{ 100 - states('input_number.fossil_percentage') | float(0) }}"
        availability: "{{ is_state('input_boolean.grid_available', 'on') }}"
