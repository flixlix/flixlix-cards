# Home Flow Card playground. It reads the same sensors as the Power Flow dashboard, so the
# scenarios and sliders there drive these cards too.
title: Home Flow
views:
  - title: Home Flow
    path: home-flow
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Scenarios
            icon: mdi:play-box-multiple
          - type: entities
            title: Run a scenario
            show_header_toggle: false
            entities:
              - script.scenario_default
              - script.scenario_all_zero
              - script.scenario_solar_exporting
              - script.scenario_battery_charging_from_grid
              - script.scenario_battery_discharging_to_grid
              - script.scenario_battery_charging_steady
              - script.scenario_battery_discharging_steady
              - script.scenario_grid_outage_generator
          - type: entities
            title: Knobs
            show_header_toggle: false
            entities:
              - input_number.solar_power
              - input_number.battery_charge_power
              - input_number.battery_discharge_power
              - input_number.battery_soc
              - input_number.grid_import_power
              - input_number.grid_export_power
              - input_boolean.power_outage
              - input_number.generator_power
      - type: grid
        cards:
          - type: heading
            heading: Live or over a period
            icon: mdi:toggle-switch-outline
          - type: custom:home-flow-card
            title: Live or today
            grid:
              entity:
                consumption: sensor.grid_import_power
                production: sensor.grid_export_power
            solar:
              entity: sensor.solar_power
            battery:
              entity:
                consumption: sensor.battery_discharge_power
                production: sensor.battery_charge_power
              state_of_charge: sensor.battery_soc
            energy_entities:
              grid:
                consumption: sensor.grid_import_energy
                production: sensor.grid_export_energy
              solar: sensor.solar_energy
              battery:
                consumption: sensor.battery_discharge_energy
                production: sensor.battery_charge_energy
          - type: custom:home-flow-card
            title: Live or today, car and heat pump
            grid:
              entity:
                consumption: sensor.grid_import_power
                production: sensor.grid_export_power
            solar:
              entity: sensor.solar_power
            battery:
              entity:
                consumption: sensor.battery_discharge_power
                production: sensor.battery_charge_power
              state_of_charge: sensor.battery_soc
            car:
              entity: sensor.car_power
              state_of_charge: sensor.car_battery
            heat_pump:
              entity: sensor.heat_pump_power
              climate: climate.heat_pump
            energy_entities:
              grid:
                consumption: sensor.grid_import_energy
                production: sensor.grid_export_energy
              solar: sensor.solar_energy
              battery:
                consumption: sensor.battery_discharge_energy
                production: sensor.battery_charge_energy
              car: sensor.ev_charger_energy
              heat_pump: sensor.heat_pump_energy
      - type: grid
        cards:
          - type: heading
            heading: Solar, battery and grid
            icon: mdi:home-lightning-bolt
          - type: custom:home-flow-card
            title: Combined entities
            clickable_entities: true
            grid:
              entity: sensor.grid_power
              power_outage:
                entity: input_boolean.power_outage
                state_alert: "on"
            generator:
              entity: sensor.generator_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
            home:
              entity: sensor.home_power
          - type: custom:home-flow-card
            title: Split entities, plain numbers
            animate_numbers: false
            grid:
              entity:
                consumption: sensor.grid_import_power
                production: sensor.grid_export_power
            solar:
              entity: sensor.solar_power
            battery:
              entity:
                consumption: sensor.battery_discharge_power
                production: sensor.battery_charge_power
              state_of_charge: sensor.battery_soc
      - type: grid
        cards:
          - type: heading
            heading: State of charge position
            icon: mdi:battery-arrow-up-outline
          - type: custom:home-flow-card
            title: Under the value (default)
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
              state_of_charge_position: below_value
          - type: custom:home-flow-card
            title: Swapped with the value
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
              state_of_charge_position: above_value
          - type: custom:home-flow-card
            title: After the value
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
              state_of_charge_position: after_value
          - type: custom:home-flow-card
            title: Before the value
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
              state_of_charge_position: before_value
      - type: grid
        cards:
          - type: heading
            heading: Older option names
            icon: mdi:history
          - type: custom:home-flow-card
            title: "Older names: after_power, expected power"
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
              state_of_charge_position: after_power
            min_expected_power: 0
            max_expected_power: 1000
          - type: custom:home-flow-card
            title: "Generic names: after_value, expected value"
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
              state_of_charge_position: after_value
            min_expected_value: 0
            max_expected_value: 1000
      - type: grid
        cards:
          - type: heading
            heading: Energy over the period
            icon: mdi:calendar
          - type: energy-date-selection
          - type: custom:home-flow-card
            title: Energy over the period
            mode: energy
            two_way_value_size: 0.8
            max_expected_value: 20000
            grid:
              entity:
                consumption: sensor.grid_import_energy
                production: sensor.grid_export_energy
            solar:
              entity: sensor.solar_energy
            battery:
              entity:
                consumption: sensor.battery_discharge_energy
                production: sensor.battery_charge_energy
              state_of_charge: sensor.battery_soc
              state_of_charge_position: after_value
            car:
              entity: sensor.ev_charger_energy
            heat_pump:
              entity: sensor.heat_pump_energy
          - type: custom:home-flow-card
            title: "Energy, older names: a range in W does not apply"
            mode: energy
            max_expected_power: 20000
            grid:
              entity:
                consumption: sensor.grid_import_energy
                production: sensor.grid_export_energy
            solar:
              entity: sensor.solar_energy
            battery:
              entity:
                consumption: sensor.battery_discharge_energy
                production: sensor.battery_charge_energy
              state_of_charge: sensor.battery_soc
              state_of_charge_position: after_power
      - type: grid
        cards:
          - type: heading
            heading: With the grid
            icon: mdi:transmission-tower
          - type: custom:home-flow-card
            title: Solar and grid
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            home:
              entity: sensor.home_power
          - type: custom:home-flow-card
            title: Battery and grid
            grid:
              entity: sensor.grid_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
            home:
              entity: sensor.home_power
          - type: custom:home-flow-card
            title: Grid only
            grid:
              entity: sensor.grid_power
          - type: custom:home-flow-card
            title: Outage without a generator
            grid:
              entity: sensor.grid_power
              power_outage:
                entity: input_boolean.power_outage
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
      - type: grid
        cards:
          - type: heading
            heading: Off the grid
            icon: mdi:home-battery
          - type: custom:home-flow-card
            title: Solar and battery
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
            home:
              entity: sensor.home_power
          - type: custom:home-flow-card
            title: Solar only
            solar:
              entity: sensor.solar_power
          - type: custom:home-flow-card
            title: Battery only
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
          - type: custom:home-flow-card
            title: Battery without state of charge
            battery:
              entity: sensor.battery_power
      - type: grid
        cards:
          - type: heading
            heading: Car
            icon: mdi:car-electric
          - type: entities
            title: Run a car scenario
            show_header_toggle: false
            entities:
              - script.car_charging
              - script.car_plugged_in_full
              - script.car_unplugged
              - script.car_away
              - script.car_feeding_home
              - script.car_sensor_unavailable
          - type: entities
            title: Car knobs
            show_header_toggle: false
            entities:
              - input_number.car_power
              - input_number.car_soc
              - input_select.car_location
              - input_boolean.car_plugged_in
              - input_boolean.car_available
          - type: custom:home-flow-card
            title: "Car: shown while home, idle while unplugged"
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
            car:
              entity: sensor.car_power
              state_of_charge: sensor.car_battery
              visibility:
                - condition: state
                  entity: input_select.car_location
                  state: home
              idle:
                - condition: state
                  entity: binary_sensor.car_plugged_in
                  state: "off"
          - type: custom:home-flow-card
            title: "Car: no conditions (idle at 0 W)"
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            car:
              entity: sensor.car_power
              state_of_charge: sensor.car_battery
              name: Model Y
          - type: custom:home-flow-card
            title: "Car: no battery level, idle below 500 W"
            grid:
              entity: sensor.grid_power
            car:
              entity: sensor.car_power
              idle:
                - condition: numeric_state
                  entity: sensor.car_power
                  above: -500
                  below: 500
      - type: grid
        cards:
          - type: heading
            heading: Heat pump
            icon: mdi:heat-pump
          - type: entities
            title: Run a heat pump scenario
            show_header_toggle: false
            entities:
              - script.heat_pump_heating
              - script.heat_pump_reached_target
              - script.heat_pump_off
          - type: entities
            title: Heat pump knobs
            show_header_toggle: false
            entities:
              - climate.heat_pump
              - input_number.heat_pump_power
              - input_number.heat_pump_flow_temperature
          - type: custom:home-flow-card
            title: "Heat pump: its state, no car (low, further along the wall)"
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            battery:
              entity: sensor.battery_power
              state_of_charge: sensor.battery_soc
            heat_pump:
              entity: sensor.heat_pump_power
              climate: climate.heat_pump
          - type: custom:home-flow-card
            title: "Heat pump: temperature and target, above the car"
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            car:
              entity: sensor.car_power
              state_of_charge: sensor.car_battery
              visibility:
                - condition: state
                  entity: input_select.car_location
                  state: home
            heat_pump:
              entity: sensor.heat_pump_power
              climate: climate.heat_pump
              status: temperature_and_target
          - type: custom:home-flow-card
            title: "Heat pump: current temperature only"
            grid:
              entity: sensor.grid_power
            heat_pump:
              entity: sensor.heat_pump_power
              climate: climate.heat_pump
              status: temperature
          - type: custom:home-flow-card
            title: "Heat pump: no climate entity"
            grid:
              entity: sensor.grid_power
            solar:
              entity: sensor.solar_power
            heat_pump:
              entity: sensor.heat_pump_power
              name: Wärmepumpe
