name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Chromium and its system libraries come with the image, so no apt download from Ubuntu mirrors.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and type checks
        run: pnpm check

      - name: Build cards (fails on syntax older browsers cannot parse)
        run: pnpm build:cards

      - name: Test
        run: pnpm test

  visual:
    # Screenshot comparison in the image the baselines were made in (`pnpm test:visual`).
    # Keep both jobs' image tags in step with the `playwright` version in pnpm-workspace.yaml.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Visual tests
        run: pnpm --recursive --filter "./packages/flixlix-cards/**" run test:visual

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: packages/flixlix-cards/*/.vitest/attachments/
